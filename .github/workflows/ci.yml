name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  addin:
    name: Excel add-in (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addin/package-lock.json
      # The add-in's tests compare it with the Python app, so they need pandas to generate the expected answers.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pydantic
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
