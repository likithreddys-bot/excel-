<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet Assistant</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #1f2328; background: #f6f7f9; height: 100vh; display: flex; }
  #chat { width: 380px; min-width: 300px; display: flex; flex-direction: column; border-right: 1px solid #d8dde3; background: #fff; }
  #chat header { padding: 12px 16px; border-bottom: 1px solid #d8dde3; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 8px 12px; border-radius: 8px; max-width: 95%; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #eef1f5; }
  .err { align-self: flex-start; background: #fdecec; color: #9b1c1c; }
  .plan ul { margin: 6px 0; padding-left: 18px; }
  .plan code { font-size: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #c4cad2; background: #fff; cursor: pointer; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button:disabled { opacity: .5; cursor: default; }
  #examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 0; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 12px; background: #eef1f5; border: 1px solid #d8dde3; cursor: pointer; }
  .chip:hover { background: #e2e8f0; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #d8dde3; }
  textarea { flex: 1; font: inherit; padding: 8px; border: 1px solid #c4cad2; border-radius: 6px; resize: none; height: 60px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #d8dde3; background: #fff; flex-wrap: wrap; }
  #toolbar .spacer { flex: 1; }
  #tabs { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
  .tab { padding: 6px 10px; border: 1px solid #d8dde3; border-bottom: none; border-radius: 6px 6px 0 0; background: #eef1f5; cursor: pointer; white-space: nowrap; }
  .tab.active { background: #fff; font-weight: 600; }
  #grid { flex: 1; overflow: auto; background: #fff; margin: 0 16px 8px; border: 1px solid #d8dde3; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e3e7ec; padding: 4px 8px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: #f0f2f5; text-align: left; }
  #drop { flex: 1; display: flex; align-items: center; justify-content: center; margin: 16px; border: 2px dashed #c4cad2; border-radius: 12px; color: #57606a; text-align: center; }
  #drop.over { border-color: #2563eb; background: #eef4ff; }
  #history { padding: 0 16px 12px; font-size: 13px; color: #57606a; max-height: 120px; overflow-y: auto; }
  #history li.inactive { text-decoration: line-through; opacity: .6; }
  #extra-files .chip { cursor: default; }
  #user { color: #57606a; font-size: 13px; }
  .notes { margin-top: 6px; padding: 6px 8px; background: #fff8e1; border-radius: 6px; font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<section id="chat">
  <header>Sheet Assistant</header>
  <div id="messages">
    <div class="msg bot">Upload a CSV or XLSX file, then tell me what you want done with it.</div>
  </div>
  <div id="examples" class="hidden"></div>
  <form id="ask">
    <textarea id="input" placeholder="e.g. only debits over 5000, split by category" disabled></textarea>
    <button class="primary" id="send" disabled>Send</button>
  </form>
</section>

<section id="main">
  <div id="toolbar">
    <button id="upload-btn">Upload file</button>
    <input type="file" id="file" accept=".csv,.xlsx,.xlsm,.xls" hidden>
    <span id="fileinfo"></span>
    <button id="add-file-btn" class="hidden" title="Another file to look up from, append or compare with">+ Add lookup file</button>
    <input type="file" id="extra-file" accept=".csv,.xlsx,.xlsm,.xls" hidden>
    <span id="extra-files"></span>
    <span class="spacer"></span>
    <button id="undo" disabled>Undo</button>
    <button id="redo" disabled>Redo</button>
    <button id="dl-xlsx" disabled>Download XLSX</button>
    <button id="dl-csv" disabled>Download CSV</button>
    <span id="user" title=""></span>
    <button id="logout" title="Log out and delete your uploaded data now">Log out</button>
  </div>
  <div id="drop">Drop a CSV or XLSX file here<br>or use “Upload file”</div>
  <div id="tabs" class="hidden"></div>
  <div id="grid" class="hidden"></div>
  <ol id="history" class="hidden"></ol>
</section>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null, sheets = [], activeSheet = 0;

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function addMsg(html, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}

// Every API call goes through here: an expired login goes back to the login page.
async function send(path, options) {
  const res = await fetch(path, options);
  if (res.status === 401) { location.href = "/login"; throw new Error("Please log in again."); }
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res;
}

async function api(path, body) {
  const res = await send(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return res.json();
}

async function download(fmt) {
  try {
    const res = await send(`/api/download/${sessionId}?fmt=${fmt}`);
    const name = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "")?.[1] || `result.${fmt}`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await res.blob());
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (err) {
    addMsg(esc(err.message), "err");
  }
}

fetch("/api/me").then((r) => (r.status === 401 ? (location.href = "/login") : r.json())).then((me) => {
  if (!me || !me.user) return;
  $("user").textContent = me.user;
  addMsg(`Logged in as <b>${esc(me.user)}</b>. Your uploaded data is deleted after ${me.idle_minutes} minutes ` +
    `without activity, or as soon as you log out.`, "bot");
});

$("logout").onclick = async () => {
  await fetch("/api/logout", { method: "POST" });
  location.href = "/login";
};

function render(state) {
  sheets = state.sheets;
  activeSheet = Math.min(activeSheet, sheets.length - 1);
  const total = sheets.reduce((n, s) => n + s.rows, 0);
  $("fileinfo").textContent = `${state.filename} · ${sheets.length} sheet(s) · ${total.toLocaleString()} rows`;
  $("add-file-btn").classList.remove("hidden");
  $("extra-files").innerHTML = state.files
    .map((f) => `<span class="chip" title="${esc(f.columns.join(", "))}">${esc(f.name)} (${f.rows.toLocaleString()} rows)</span>`).join(" ");
  $("undo").disabled = !state.can_undo;
  $("redo").disabled = !state.can_redo;
  for (const id of ["dl-xlsx", "dl-csv", "input", "send"]) $(id).disabled = false;
  $("drop").classList.add("hidden");
  $("examples").classList.remove("hidden");
  $("tabs").classList.remove("hidden");
  $("grid").classList.remove("hidden");
  $("history").classList.toggle("hidden", !state.history.length);
  $("history").innerHTML = state.history
    .map((h) => `<li class="${h.active ? "" : "inactive"}" title="${esc(h.summary)}">${esc(h.request)}</li>`).join("");
  renderSheet();
}

function renderSheet() {
  $("tabs").innerHTML = sheets
    .map((s, i) => `<div class="tab ${i === activeSheet ? "active" : ""}" data-i="${i}">${esc(s.name)} (${s.rows.toLocaleString()})</div>`).join("");
  const s = sheets[activeSheet];
  const head = "<tr>" + s.columns.map((c) => `<th>${esc(c)}</th>`).join("") + "</tr>";
  // Highlights from "highlight ..." commands, so they can be checked before downloading.
  const bg = (colour) => (colour ? ` style="background:#${esc(colour)}"` : "");
  const body = s.data.map((r, i) => {
    const st = (s.styles && s.styles[i]) || { row: null, cells: {} };
    return `<tr${bg(st.row)}>` + r.map((v, j) => `<td${bg(st.cells[s.columns[j]])}>${esc(v)}</td>`).join("") + "</tr>";
  }).join("");
  const more = s.rows > s.data.length ? `<p style="padding:4px 8px;color:#57606a">Showing first ${s.data.length} of ${s.rows.toLocaleString()} rows</p>` : "";
  $("grid").innerHTML = `<table>${head}${body}</table>${more}`;
}

$("tabs").addEventListener("click", (e) => {
  const i = e.target.dataset.i;
  if (i !== undefined) { activeSheet = +i; renderSheet(); }
});

async function uploadFile(file) {
  const fd = new FormData();
  fd.append("file", file);
  addMsg(`Uploading ${esc(file.name)}…`, "bot");
  try {
    const data = await (await send("/api/upload", { method: "POST", body: fd })).json();
    sessionId = data.session_id;
    activeSheet = 0;
    render(data);
    const cols = data.sheets[0].columns.map((c) => `<code>${esc(c)}</code>`).join(", ");
    const kept = data.kept_sheets.length
      ? `\nWorking on sheet <b>${esc(data.sheets[0].name)}</b>. Other sheets (${data.kept_sheets.map(esc).join(", ")}) are kept unchanged in the download.`
      : "";
    addMsg(`Loaded <b>${data.sheets[0].rows.toLocaleString()}</b> rows. Columns: ${cols}${kept}`, "bot");
  } catch (err) {
    addMsg(esc(err.message), "err");
  }
}

$("upload-btn").onclick = () => $("file").click();
$("file").onchange = (e) => e.target.files[0] && uploadFile(e.target.files[0]);

$("add-file-btn").onclick = () => $("extra-file").click();
$("extra-file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !sessionId) return;
  const fd = new FormData();
  fd.append("session_id", sessionId);
  fd.append("file", file);
  try {
    const data = await (await send("/api/files", { method: "POST", body: fd })).json();
    render(data);
    const f = data.files.find((x) => file.name.startsWith(x.name)) || data.files[data.files.length - 1];
    addMsg(`Added <b>${esc(f.name)}</b> (${f.rows.toLocaleString()} rows). Columns: ${f.columns.map((c) => `<code>${esc(c)}</code>`).join(", ")}` +
      `\nTry: <i>bring ${esc(f.columns[1] || f.columns[0])} from ${esc(f.name)} on ${esc(f.columns[0])}</i>, ` +
      `<i>rows not in ${esc(f.name)}</i> or <i>append ${esc(f.name)}</i>`, "bot");
  } catch (err) {
    addMsg(esc(err.message), "err");
  }
  e.target.value = "";
};
for (const ev of ["dragover", "dragleave", "drop"]) {
  document.body.addEventListener(ev, (e) => {
    e.preventDefault();
    $("drop").classList.toggle("over", ev === "dragover");
    if (ev === "drop" && e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
  });
}

$("ask").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || !sessionId) return;
  $("input").value = "";
  addMsg(esc(text), "user");
  $("send").disabled = true;
  const thinking = addMsg("Planning…", "bot");
  try {
    const r = await api("/api/plan", { session_id: sessionId, message: text });
    thinking.remove();
    if (r.clarification_question) { addMsg(esc(r.clarification_question), "bot"); return; }
    if (r.error) { addMsg(esc(r.error), "err"); return; }
    const after = Object.entries(r.rows_after);
    const total = after.reduce((n, [, v]) => n + v, 0);
    const counts = after.length > 1
      ? "<ul>" + after.map(([k, v]) => `<li>${esc(k)}: ${v.toLocaleString()} rows</li>`).join("") + "</ul>" : "";
    const card = addMsg(
      `<div class="plan"><b>Here's what I'll do:</b><ul>${r.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` +
      `${r.rows_before.toLocaleString()} rows → <b>${total.toLocaleString()}</b> rows in ${after.length} sheet(s)${counts}` +
      (r.notes.length ? `<div class="notes">${r.notes.map(esc).join("<br>")}</div>` : "") +
      `<div class="actions"><button class="primary">Run it</button><button>Cancel</button></div></div>`, "bot");
    const [run, cancel] = card.querySelectorAll("button");
    run.onclick = async () => {
      run.disabled = cancel.disabled = true;
      try { render(await api("/api/execute", { session_id: sessionId })); addMsg("Done.", "bot"); }
      catch (err) { addMsg(esc(err.message), "err"); }
    };
    cancel.onclick = () => { run.disabled = cancel.disabled = true; addMsg("Cancelled.", "bot"); };
  } catch (err) {
    thinking.remove();
    addMsg(esc(err.message), "err");
  } finally {
    $("send").disabled = false;
  }
};
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); }
});

const EXAMPLES = [
  "only debits over 5000", "in the last 30 days", "description contains ATM", "split by category",
  "sort by amount descending", "keep columns date, amount", "total amount by category", "remove duplicate rows",
  "pivot amount by category and txn type", "total amount by month", "top 10 by amount", "add % of total",
  "trim spaces", "fill blank branch with Unknown", 'replace "UPI/" with "" in description',
  "add column gst = amount * 18%", "add column size = high if amount > 1 lakh else low", "add days since txn date",
  "highlight rows where amount > 1 lakh in red", "show amount in rupees", "bar chart of total amount by category",
];
$("examples").innerHTML = EXAMPLES.map((e) => `<span class="chip">${esc(e)}</span>`).join("");
$("examples").addEventListener("click", (e) => {
  if (e.target.classList.contains("chip") && !$("input").disabled) { $("input").value = e.target.textContent; $("input").focus(); }
});

$("undo").onclick =async () => render(await api("/api/undo", { session_id: sessionId }));
$("redo").onclick = async () => render(await api("/api/redo", { session_id: sessionId }));
$("dl-xlsx").onclick = () => download("xlsx");
$("dl-csv").onclick = () => download("csv");
</script>
</body>
</html>
